[metadata]
name = capstone
version = 0.1.0
description = End-to-end machine learning capstone project (California Housing)
author = Toddni8022
license = MIT
python_requires = >=3.8

[options]
package_dir =
    = src
packages = find:
install_requires =
    numpy>=1.23
    pandas>=1.5
    scikit-learn>=1.2
    matplotlib>=3.6
    seaborn>=0.12
    joblib>=1.2

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0
    flake8>=6.0
    black>=23.0

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    notebooks
